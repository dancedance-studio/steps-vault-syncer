# Builds dancedance.studio Sync for Windows in public CI, publishes it as a test version (a GitHub pre-release) and
# checks it on a clean Windows machine (docs/releasing.md). Players get it only when the owner runs the "ship-it"
# workflow.
#
# Two ways, chosen by the SIGNPATH_* variables:
# - Unsigned (no SignPath variables; today, docs/code-signing-policy.md): a tag publishes the unsigned build, and the
#   check makes sure nothing in it is signed, so a half-signed build is caught.
# - Signed (SignPath set up): signing happens twice because Smart App Control checks both: first every program inside
#   the app, then the installer made from the signed app. The owner approves each signing request by hand on SignPath;
#   #admins on Discord is told.
# A manual run builds the unsigned installer and checks it the same way, but never publishes or posts anything.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-app:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      app-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - id: version
        name: The app's version (and for a tag, that the tag matches it)
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $version in apps/desktop/package.json."
            exit 1
          fi
      - name: The tag has a "What's new" message
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash apps/desktop/scripts/get-whats-new.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/whats-new.md"
          cat "$RUNNER_TEMP/whats-new.md"
      # electron-builder writes the app's update settings (resources/app-update.yml) only when it packages for an NSIS
      # target, never for --dir, and a --prepackaged installer doesn't add them. Without them the app can't update itself,
      # so the app is packaged with an installer that is thrown away; the real one is built from this app folder later.
      - name: Package the app (its installer comes later)
        working-directory: apps/desktop
        run: |
          node scripts/build.mjs
          pnpm exec electron-builder --win nsis --publish never
          cat release/win-unpacked/resources/app-update.yml
      - id: upload-app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: app-unsigned
          path: apps/desktop/release/win-unpacked/
          retention-days: 7

  sign-app:
    needs: package-app
    # Only a tag is signed: every signing request waits for the owner's approval.
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    # The owner has up to 5.5 hours to approve (wait-for-signing.mjs); a job can't run longer than 6.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read  # SignPath downloads the artifact with this job's token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - id: submit
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b  # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app-folder
          github-artifact-id: ${{ needs.package-app.outputs.app-artifact-id }}
          # Returns once SignPath has the artifact, so #admins hears at once; the next steps wait for the approval.
          wait-for-completion: false
      - name: 'Ask #admins to approve'
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ADMINS_WEBHOOK_URL }}
          DISCORD_MESSAGE: 'Signature needed: Sync ${{ needs.package-app.outputs.version }} → [Approve on SignPath](<${{ steps.submit.outputs.signing-request-web-url || format(''https://app.signpath.io/Web/{0}/Projects'', vars.SIGNPATH_ORGANIZATION_ID) }}>) · 1 of 2: the programs inside the app'
        run: bash apps/desktop/scripts/post-to-discord.sh admins
      - name: Wait for the approval, then download the signed app
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNING_REQUEST_ID: ${{ steps.submit.outputs.signing-request-id }}
        run: node apps/desktop/scripts/wait-for-signing.mjs signed-app.zip
      - name: Unpack the signed app
        shell: pwsh
        run: Expand-Archive -LiteralPath signed-app.zip -DestinationPath signed-app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: app-signed
          path: signed-app/
          retention-days: 7

  build-installer:
    needs: [package-app, sign-app]
    # Runs after signing, or straight after packaging when nothing is signed (an unsigned release, or a manual run).
    if: ${{ !cancelled() && needs.package-app.result == 'success' && needs.sign-app.result != 'failure' && needs.sign-app.result != 'cancelled' }}
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      is-signed-app: ${{ needs.sign-app.result == 'success' }}
      installer-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.sign-app.result == 'success' && 'app-signed' || 'app-unsigned' }}
          path: apps/desktop/release/app
      - name: Build the installer from the (signed) app
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win nsis --prepackaged release/app --publish never
      # SignPath gets a zip holding only the installer; the update files wait for the signed installer.
      - id: upload-installer
        if: needs.sign-app.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: installer-unsigned
          path: apps/desktop/release/*.exe
          retention-days: 7
      - if: needs.sign-app.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: update-files
          path: apps/desktop/release/latest.yml
          retention-days: 7
      # Unsigned, the files are ready as they are: electron-builder wrote latest.yml and the blockmap for this installer.
      - if: needs.sign-app.result != 'success'
        name: Nothing in the unsigned build is signed, and write checksums
        shell: bash
        working-directory: apps/desktop/release
        run: |
          node ../scripts/check-signature.mjs "$(ls *.exe)" --not-signed
          node ../scripts/check-signature.mjs "app/dancedance.studio Sync.exe" --not-signed
          sha256sum *.exe *.blockmap latest.yml > SHA256SUMS.txt && cat SHA256SUMS.txt
      - if: needs.sign-app.result != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-files
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/SHA256SUMS.txt
          retention-days: 7

  sign-installer:
    needs: [package-app, sign-app, build-installer]
    if: ${{ !cancelled() && needs.sign-app.result == 'success' && needs.build-installer.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read  # SignPath downloads the artifact with this job's token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - id: submit
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b  # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ needs.build-installer.outputs.installer-artifact-id }}
          wait-for-completion: false
      - name: 'Ask #admins to approve'
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ADMINS_WEBHOOK_URL }}
          DISCORD_MESSAGE: 'Signature needed: Sync ${{ needs.package-app.outputs.version }} → [Approve on SignPath](<${{ steps.submit.outputs.signing-request-web-url || format(''https://app.signpath.io/Web/{0}/Projects'', vars.SIGNPATH_ORGANIZATION_ID) }}>) · 2 of 2: the installer'
        run: bash apps/desktop/scripts/post-to-discord.sh admins
      # The electron-builder that makes the blockmap again is a dev dependency; the app's own runtime isn't needed.
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Wait for the approval, then download the signed installer
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNING_REQUEST_ID: ${{ steps.submit.outputs.signing-request-id }}
        run: node apps/desktop/scripts/wait-for-signing.mjs signed-installer.zip
      - name: Unpack the signed installer
        shell: pwsh
        run: Expand-Archive -LiteralPath signed-installer.zip -DestinationPath release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: update-files
          path: release
      - name: Point the update files at the signed installer, and write checksums
        shell: bash
        run: |
          node apps/desktop/scripts/refresh-update-files.mjs release
          node apps/desktop/scripts/check-signature.mjs "$(ls release/*.exe)" "SignPath Foundation"
          (cd release && sha256sum *.exe *.blockmap latest.yml > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-files
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          retention-days: 7

  publish-test-version:
    needs: [package-app, build-installer, sign-installer]
    # Signed: once both signings passed. Unsigned: only while SignPath isn't set up, so a signed release that stopped
    # never goes out unsigned.
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && (needs.sign-installer.result == 'success'
      || (vars.SIGNPATH_ORGANIZATION_ID == '' && needs.build-installer.result == 'success' && needs.build-installer.outputs.is-signed-app != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-files
          path: release
      - name: Publish the files as a test version (a GitHub pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package-app.outputs.version }}
          IS_SIGNED: ${{ needs.build-installer.outputs.is-signed-app }}
          # Under the What's new on the release page only; #announcements gets the tag's message as it is.
          UNSIGNED_NOTE: >-
            **This version isn't code signed yet.** Windows says it comes from an unknown publisher: choose **More
            info**, then **Run anyway**. PCs with Smart App Control block it; there, use Sync in the browser on
            [dancedance.studio](https://dancedance.studio). How to check your download:
            [code signing policy](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/code-signing-policy.md).
        run: |
          bash apps/desktop/scripts/get-whats-new.sh "$GITHUB_REF_NAME" whats-new.md
          if [ "$IS_SIGNED" != "true" ]; then printf '\n---\n\n%s\n' "$UNSIGNED_NOTE" >> whats-new.md; fi
          gh release create "$GITHUB_REF_NAME" release/*.exe release/*.blockmap release/latest.yml release/SHA256SUMS.txt \
            --verify-tag --prerelease --title "dancedance.studio Sync $VERSION" --notes-file whats-new.md
      - name: 'Tell #admins the unsigned test version is out'
        if: needs.build-installer.outputs.is-signed-app != 'true'
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ADMINS_WEBHOOK_URL }}
          DISCORD_MESSAGE: 'Sync ${{ needs.package-app.outputs.version }} test version is out (unsigned) → [The test version](<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}>) · the automatic check is next'
        run: bash apps/desktop/scripts/post-to-discord.sh admins

  # A fresh machine that never built anything: it downloads what players would, and installs it like a player. A manual
  # run checks its unsigned build the same way, from the run's own files (nothing is published), and posts nothing.
  check-test-version:
    needs: [package-app, build-installer, publish-test-version]
    if: >-
      ${{ !cancelled() && (needs.publish-test-version.result == 'success'
      || (!startsWith(github.ref, 'refs/tags/v') && needs.build-installer.result == 'success' && needs.build-installer.outputs.is-signed-app != 'true')) }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.package-app.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - id: download
        if: startsWith(github.ref, 'refs/tags/v')
        name: Download the test version from its GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir test-version
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        name: Take the test build from this run (a manual run publishes nothing)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-files
          path: test-version
      - id: installer-signature
        if: needs.build-installer.outputs.is-signed-app == 'true'
        name: The installer's signature
        shell: bash
        run: node apps/desktop/scripts/check-signature.mjs "$(ls test-version/*.exe)" "SignPath Foundation"
      - id: installer-not-signed
        if: needs.build-installer.outputs.is-signed-app != 'true'
        name: The installer has no signature (an unsigned release)
        shell: bash
        run: node apps/desktop/scripts/check-signature.mjs "$(ls test-version/*.exe)" --not-signed
      - id: update-files
        name: latest.yml and the checksums match the installer
        shell: bash
        run: |
          node apps/desktop/scripts/check-update-files.mjs test-version "$VERSION"
          (cd test-version && sha256sum --check SHA256SUMS.txt)
      - id: install
        name: Install, start and uninstall the test version
        shell: pwsh
        env:
          # Empty for an unsigned release: then the installed app must have no signature either.
          EXPECTED_PUBLISHER: ${{ needs.build-installer.outputs.is-signed-app == 'true' && 'SignPath Foundation' || '' }}
        run: ./apps/desktop/scripts/check-installer.ps1 -Installer (Get-Item test-version/*.exe).FullName -Version $env:VERSION -ExpectedPublisher "$env:EXPECTED_PUBLISHER"
      - name: 'Tell #admins it is ready to ship'
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ADMINS_WEBHOOK_URL }}
          DISCORD_MESSAGE: 'Sync ${{ needs.package-app.outputs.version }} checked ✓ · ready to ship → [Run Ship it](<${{ github.server_url }}/${{ github.repository }}/actions/workflows/ship-it.yml>)'
        run: bash apps/desktop/scripts/post-to-discord.sh admins
      - name: 'Tell #admins the check failed'
        if: failure() && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ADMINS_WEBHOOK_URL }}
          FAILED_STEP: >-
            ${{ steps.download.outcome == 'failure' && 'downloading the test version'
            || (steps.installer-signature.outcome == 'failure' || steps.installer-not-signed.outcome == 'failure') && 'the installer''s signature'
            || steps.update-files.outcome == 'failure' && 'latest.yml and the checksums'
            || steps.install.outcome == 'failure' && (steps.install.outputs.failed-step || 'installing the test version')
            || 'getting the machine ready' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export DISCORD_MESSAGE="MISS Sync $VERSION check failed: $FAILED_STEP → [See the run](<$RUN_URL>)"
          bash apps/desktop/scripts/post-to-discord.sh admins

  # Anything before the check that stops a tagged release (a signing request denied or not approved in time, a failed
  # build) is said on #admins too; the check says its own result. A job that ran out of time counts as cancelled.
  tell-admins-release-stopped:
    needs: [package-app, sign-app, build-installer, sign-installer, publish-test-version]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ADMINS_WEBHOOK_URL }}
          FAILED_JOB: >-
            ${{ needs.package-app.result != 'success' && 'building and testing'
            || (needs.sign-app.result == 'failure' || needs.sign-app.result == 'cancelled') && 'signing the app'
            || (needs.build-installer.result == 'failure' || needs.build-installer.result == 'cancelled') && 'building the installer'
            || (needs.sign-installer.result == 'failure' || needs.sign-installer.result == 'cancelled') && 'signing the installer'
            || 'publishing the test version' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export DISCORD_MESSAGE="MISS Sync $GITHUB_REF_NAME stopped at $FAILED_JOB → [See the run](<$RUN_URL>)"
          bash apps/desktop/scripts/post-to-discord.sh admins
